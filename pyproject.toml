[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crates-music-mcp"
version = "0.1.1"
description = "把你三个音乐 App（网易云 / QQ 音乐 / 酷狗）的收藏交给 Agent，让它每天替你挑一张对味的歌单"
keywords = ["mcp", "model-context-protocol", "netease", "qqmusic", "kugou", "playlist", "music"]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "crates-music-mcp"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.10,<2",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "qqmusic-api-python>=0.5.0",
    "Pillow>=10.0",
    # 本地渲染二维码（网易云 / 酷狗都只回登录链接或纯文本，图片由我们自己画）
    "qrcode>=7.4",
]

# 不再依赖 pymusiclibrary：网易云与酷狗都已改成纯 Python 直连官方 WebAPI
# （ncm_native.py / kugou_native.py + 各自的 crypto 层），QQ 走第三方纯 Python 库。
# 那个包在 Linux 上装的是「里面塞了 Windows DLL」的 manylinux wheel，本来也用不了；
# 三平台现在一个原生依赖都没有，不需要容器、不需要 sidecar。

[project.scripts]
crates-music = "music_mcp.app:main_all"
crates-auth = "music_mcp.app:main"
crates-profile = "music_mcp.app:main_profile"
crates-playlist = "music_mcp.app:main_playlist"

[tool.setuptools]
# 别忘了子包：漏了 platforms / platforms.core 打出来的轮子会缺整个协议层
packages = ["music_mcp", "music_mcp.platforms", "music_mcp.platforms.core"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
music_mcp = ["*.md"]
