[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crates-music-mcp"
version = "0.1.0"
description = "Music MCP servers: QQ Music + NetEase auth, profile analysis, playlist creation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "crates"}]
dependencies = [
    "mcp>=1.10,<2",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "qqmusic-api-python>=0.5.0",
    "Pillow>=10.0",
    # 酷狗引擎（MusicLibrary/kuGouMusicApi）。网易云不吃这口：它走纯 Python 的
    # ncm_native（自己算 weapi/eapi 直连官方 WebAPI），所以 Linux 上这个坏轮子
    # （manylinux wheel 里塞的是 Windows DLL）只影响酷狗。
    "pymusiclibrary>=0.0.4",
    # 本地渲染网易云登录二维码（上游只回登录链接文本）
    "qrcode>=7.4",
]

# 没有 optional-dependencies：原来那个 sdk extra（"pymusic-library>=0.1.0"）在 PyPI
# 上是 404（真名 pymusiclibrary，没有连字符，0.0.4 起才有 win/manylinux 轮子），
# 而且网易云 SDK 后端已经删掉了 —— pymusiclibrary 现在只是酷狗引擎的运行时依赖。

[project.scripts]
crates-music = "music_mcp.app:main_all"
crates-auth = "music_mcp.app:main"
crates-profile = "music_mcp.app:main_profile"
crates-playlist = "music_mcp.app:main_playlist"

[tool.setuptools]
# 别忘了子包：漏了 platforms 打出来的轮子会缺整个平台层
packages = ["music_mcp", "music_mcp.platforms"]

[tool.setuptools.package-data]
music_mcp = ["*.md"]
