name: CI

# 只跑**离线**自检：
#   * 联网那部分（NCM_LIVE=1 / KUGOU_LIVE=1）需要真实账号的 Cookie/凭证，不能进 CI；
#   * 而且 CI 机房在境外，访问国内音乐接口不稳定，跑出来是假红。
# 离线部分反而是这个项目最硬的证据：密码学对官方向量、协议对上游 JS。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    name: 离线自检（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 数据目录指向临时目录
        # 不能写在 job 级 env 里：runner 上下文只在步骤里可用
        # （写 job env 会直接让 workflow 解析失败："Unrecognized named-value: 'runner'"）
        run: echo "MUSIC_DATA_DIR=$RUNNER_TEMP/music-data" >> "$GITHUB_ENV"

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # 明确断言不该出现原生依赖（pymusiclibrary 的 manylinux wheel 里是 Windows DLL）
          python -c "import importlib.util as u; assert u.find_spec('MusicLibrary') is None, 'pymusiclibrary 又回来了'"

      - name: 网易云：AES/RSA/weapi/eapi 对 FIPS-197 / NIST 官方向量
        run: python tests/test_ncm_native.py

      - name: 酷狗：签名/RSA/AES 与上游 JS 逐字节对拍
        run: python tests/test_kugou_native.py

      - name: 歌单命名与台账（长度上限/指定优先/随机兜底/去重窗口/台账派生）
        run: python tests/test_theme_naming.py

      - name: 画像权重 / 登录方式 / poll / stdio
        run: |
          python tests/test_profile_rank.py
          python tests/test_methods.py
          python tests/test_poll_fast.py
          for server in all auth profile playlist; do
            python tests/test_stdio.py "$server"
          done

  package:
    name: 打包检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 产物里必须有协议层与 LICENSE
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          must_have = [
              "music_mcp/platforms/core/ncm_crypto.py",
              "music_mcp/platforms/core/kugou_crypto.py",
              "music_mcp/platforms/core/kugou_native.py",
              "music_mcp/platforms/core/aes.py",
          ]
          missing = [name for name in must_have if name not in names]
          assert not missing, f"wheel 里缺文件：{missing}"
          assert any(name.endswith("licenses/LICENSE") for name in names), "wheel 里缺 LICENSE"
          print(f"OK {wheel}：{len(names)} 个条目")
          PY
